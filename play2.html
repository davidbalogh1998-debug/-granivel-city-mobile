<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0a0d12"><title>Granivel City Mobile</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a0d12;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}.hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;gap:10px}.card{background:rgba(8,12,18,.72);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(10px);padding:9px 11px;border-radius:13px;font-size:12px;line-height:1.3;box-shadow:0 8px 24px rgba(0,0,0,.25)}#mission{max-width:66vw}#stats{text-align:right;font-weight:800;min-width:92px}.stars{color:#ffd84d;letter-spacing:1px}.joy{position:fixed;left:20px;bottom:max(25px,env(safe-area-inset-bottom));width:118px;height:118px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);z-index:3}.knob{position:absolute;width:50px;height:50px;border-radius:50%;left:34px;top:34px;background:rgba(255,255,255,.43)}.buttons{position:fixed;right:16px;bottom:max(22px,env(safe-area-inset-bottom));display:grid;grid-template-columns:72px 72px;gap:10px;z-index:3}.btn{height:62px;border:1px solid rgba(255,255,255,.18);border-radius:18px;background:rgba(13,18,26,.72);color:#fff;font-weight:900;font-size:12px;backdrop-filter:blur(9px)}.btn:active{transform:scale(.96);background:rgba(255,255,255,.24)}.splash{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#182235,#070a10 65%)}.box{text-align:center;padding:30px;max-width:520px}.box h1{font-size:36px;margin:0 0 12px}.box p{color:#bbc1ca;line-height:1.45}.start{border:0;border-radius:16px;padding:15px 25px;font-size:17px;font-weight:900;margin-top:8px}.small{font-size:11px;color:#838b98;margin-top:14px}.badge{display:inline-block;margin-bottom:12px;padding:6px 9px;border-radius:99px;background:rgba(255,255,255,.09);font-size:10px;font-weight:800;letter-spacing:.08em}.toast{position:fixed;left:50%;bottom:160px;transform:translateX(-50%);padding:8px 12px;border-radius:99px;background:rgba(0,0,0,.65);font-size:11px;pointer-events:none;white-space:nowrap}.cross{position:fixed;left:50%;top:50%;width:14px;height:14px;transform:translate(-50%,-50%);opacity:.5;pointer-events:none}.cross:before,.cross:after{content:"";position:absolute;background:#fff}.cross:before{left:6px;top:0;width:2px;height:14px}.cross:after{left:0;top:6px;width:14px;height:2px}</style></head><body><canvas id="game"></canvas><div class="hud"><div class="top"><div class="card" id="mission">Küldetés: menj a sárga jelzéshez.</div><div class="card" id="stats">$ <span id="money">500</span><br><span class="stars" id="stars">☆☆☆☆☆</span></div></div><div class="toast" id="toast">Joystick: mozgás • AKCIÓ: autó</div><div class="cross"></div></div><div class="joy" id="joy"><div class="knob" id="knob"></div></div><div class="buttons"><button class="btn" id="act">AKCIÓ</button><button class="btn" id="shoot">LÖVÉS</button><button class="btn" id="brake">FÉK</button><button class="btn" id="sprint">SPRINT</button></div><div class="splash" id="splash"><div class="box"><div class="badge">IPHONE SAFARI BUILD • SELF-CONTAINED</div><h1>GRANIVEL CITY</h1><p>Mobilos open-world teszt. Szerezz autót, teljesítsd a küldetést, és rázd le a rendőröket.</p><button class="start" id="start">JÁTÉK INDÍTÁSA</button><div class="small">Ez a verzió nem tölt be külső 3D motort, ezért iPhone-on stabilabban indul.</div></div></div><script>(()=>{'use strict';const c=document.getElementById('game'),x=c.getContext('2d',{alpha:false});let W=0,H=0,D=1;function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();const world=1200,roadGap=180,roadW=58;let running=false,joy={x:0,y:0},brake=false,sprint=false,wanted=0,money=500,mission=0,lastCrime=0,shootCd=0;const player={x:0,y:0,a:0,r:11},cars=[],npcs=[],police=[],bullets=[];let inCar=null,marker={x:120,y:120,show:true};const colors=['#e67e22','#2980b9','#16a085','#8e44ad','#f1c40f','#c0392b'];function rnd(a,b){return a+Math.random()*(b-a)}function addCar(px,py,col,ai=false){const o={x:px,y:py,a:Math.random()*6.28,v:0,w:28,h:50,col:col||colors[(Math.random()*colors.length)|0],ai,police:false};cars.push(o);return o}for(let i=0;i<18;i++)addCar(rnd(-500,500),Math.round(rnd(-2.5,2.5))*roadGap+rnd(-roadW*.25,roadW*.25),null,true);for(let i=0;i<5;i++)addCar([80,-120,210,-260,300][i],[-45,190,-175,260,5][i],colors[i]);for(let i=0;i<34;i++)npcs.push({x:rnd(-520,520),y:rnd(-520,520),a:rnd(0,6.28),s:rnd(8,20),alive:true});function setWanted(v){wanted=Math.max(0,Math.min(5,v));document.getElementById('stars').textContent='★'.repeat(wanted)+'☆'.repeat(5-wanted);lastCrime=performance.now()}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function nearCar(){let b=null,d=65,me=inCar||player;for(const q of cars){if(q===inCar)continue;const z=dist(me,q);if(z<d){d=z;b=q}}return b}function action(){if(!running)return;if(inCar){player.x=inCar.x+35*Math.cos(inCar.a+1.57);player.y=inCar.y+35*Math.sin(inCar.a+1.57);inCar.v=0;inCar=null;toast('Kiszálltál az autóból.');return}const q=nearCar();if(q){inCar=q;if(mission===1){mission=2;marker={x:-240,y:-210,show:true};msg('Küldetés: vidd az autót a sárga ponthoz.')}toast('Autó megszerezve.')}else toast('Menj közelebb egy autóhoz.')}function shoot(){if(!running||shootCd>0)return;shootCd=.24;const me=inCar||player,aa=inCar?inCar.a:player.a;bullets.push({x:me.x,y:me.y,a:aa,life:1});setWanted(Math.max(1,wanted));for(const n of npcs){if(!n.alive)continue;const dx=n.x-me.x,dy=n.y-me.y,d=Math.hypot(dx,dy),da=Math.abs(Math.atan2(Math.sin(Math.atan2(dy,dx)-aa),Math.cos(Math.atan2(dy,dx)-aa)));if(d<110&&da<.22){n.alive=false;money+=25;document.getElementById('money').textContent=money;setWanted(Math.max(2,wanted));break}}}function toast(t){const e=document.getElementById('toast');e.textContent=t;clearTimeout(toast.t);toast.t=setTimeout(()=>e.textContent='Joystick: mozgás • AKCIÓ: autó',1700)}function msg(t){document.getElementById('mission').textContent=t}const je=document.getElementById('joy'),kn=document.getElementById('knob');let pid=null;function jm(e){const r=je.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,m=Math.min(44,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);joy.x=Math.cos(a)*m/44;joy.y=Math.sin(a)*m/44;kn.style.transform=`translate(${joy.x*34}px,${joy.y*34}px)`}je.onpointerdown=e=>{pid=e.pointerId;je.setPointerCapture(pid);jm(e)};je.onpointermove=e=>{if(e.pointerId===pid)jm(e)};function ju(e){if(e.pointerId===pid){pid=null;joy.x=joy.y=0;kn.style.transform=''}}je.onpointerup=ju;je.onpointercancel=ju;document.getElementById('act').onpointerdown=action;document.getElementById('shoot').onpointerdown=shoot;const bb=document.getElementById('brake'),sb=document.getElementById('sprint');bb.onpointerdown=()=>brake=true;bb.onpointerup=bb.onpointercancel=()=>brake=false;sb.onpointerdown=()=>sprint=true;sb.onpointerup=sb.onpointercancel=()=>sprint=false;function spawnPolice(){while(police.length<wanted){const me=inCar||player,a=rnd(0,6.28),p={x:me.x+Math.cos(a)*260,y:me.y+Math.sin(a)*260,a:0,v:0,w:29,h:52,col:'#111',police:true};police.push(p)}}function updateMission(){const me=inCar||player;if(mission===0&&dist(me,marker)<35){mission=1;marker={x:80,y:-45,show:true};msg('Küldetés: szerezz egy autót az AKCIÓ gombbal.')}else if(mission===2&&inCar&&dist(me,marker)<48){mission=3;marker.show=false;setWanted(2);msg('Küldetés: rázd le a rendőröket!')}else if(mission===3&&wanted===0){mission=4;money+=1000;document.getElementById('money').textContent=money;msg('Küldetés teljesítve! +$1000 • Szabad játék.')}}function upd(dt,now){shootCd=Math.max(0,shootCd-dt);if(inCar){inCar.v+=(-joy.y)*135*dt;inCar.v*=brake?.87:.985;inCar.v=Math.max(-65,Math.min(210,inCar.v));inCar.a+=joy.x*dt*(1.7+Math.abs(inCar.v)/90);inCar.x+=Math.cos(inCar.a)*inCar.v*dt;inCar.y+=Math.sin(inCar.a)*inCar.v*dt}else{const m=Math.hypot(joy.x,joy.y);if(m>.06){const sp=sprint?150:90;player.x+=joy.x*sp*dt;player.y+=joy.y*sp*dt;player.a=Math.atan2(joy.y,joy.x)}}for(const q of cars){if(q===inCar||!q.ai)continue;q.v=55;q.x+=Math.cos(q.a)*q.v*dt;q.y+=Math.sin(q.a)*q.v*dt;if(Math.abs(q.x)>570||Math.abs(q.y)>570)q.a+=Math.PI}for(const n of npcs){if(!n.alive)continue;if(Math.random()<.012)n.a+=rnd(-.8,.8);n.x+=Math.cos(n.a)*n.s*dt;n.y+=Math.sin(n.a)*n.s*dt}for(const b of bullets){b.x+=Math.cos(b.a)*500*dt;b.y+=Math.sin(b.a)*500*dt;b.life-=dt}for(let i=bullets.length-1;i>=0;i--)if(bullets[i].life<=0)bullets.splice(i,1);if(wanted>0){spawnPolice();const me=inCar||player;for(const p of police){const a=Math.atan2(me.y-p.y,me.x-p.x);p.a=a;p.x+=Math.cos(a)*(75+wanted*18)*dt;p.y+=Math.sin(a)*(75+wanted*18)*dt;if(dist(p,me)<35&&now-lastCrime>2200){money=Math.max(0,money-1);document.getElementById('money').textContent=money}}if(now-lastCrime>11500){setWanted(wanted-1);lastCrime=now}}else police.length=0;updateMission()}function screen(wx,wy,cam,zoom){return{x:(wx-cam.x)*zoom+W/2,y:(wy-cam.y)*zoom+H/2}}function rectRot(o,cam,zoom,fill){const p=screen(o.x,o.y,cam,zoom);x.save();x.translate(p.x,p.y);x.rotate(o.a);x.fillStyle=fill;x.fillRect(-o.h*zoom/2,-o.w*zoom/2,o.h*zoom,o.w*zoom);x.fillStyle='rgba(255,255,255,.28)';x.fillRect(0,-o.w*zoom*.34,o.h*zoom*.28,o.w*zoom*.68);x.restore()}function draw(){const me=inCar||player,zoom=inCar?.72:.9,cam={x:me.x,y:me.y};x.fillStyle='#63745e';x.fillRect(0,0,W,H);for(let i=-3;i<=3;i++){let a=screen(i*roadGap,-world,cam,zoom),b=screen(i*roadGap,world,cam,zoom);x.strokeStyle='#2a2d31';x.lineWidth=roadW*zoom;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke();a=screen(-world,i*roadGap,cam,zoom);b=screen(world,i*roadGap,cam,zoom);x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke();x.strokeStyle='rgba(255,255,255,.18)';x.lineWidth=1;x.setLineDash([12,15]);a=screen(i*roadGap,-world,cam,zoom);b=screen(i*roadGap,world,cam,zoom);x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke();a=screen(-world,i*roadGap,cam,zoom);b=screen(world,i*roadGap,cam,zoom);x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke();x.setLineDash([])}for(let gx=-3;gx<=3;gx++)for(let gy=-3;gy<=3;gy++){if(gx===0||gy===0)continue;const p=screen(gx*roadGap+55,gy*roadGap+48,cam,zoom),w=86*zoom,h=72*zoom;x.fillStyle=((gx+gy)&1)?'#7f7469':'#66788a';x.fillRect(p.x-w/2,p.y-h/2,w,h);x.fillStyle='rgba(255,255,255,.08)';x.fillRect(p.x-w*.36,p.y-h*.36,w*.72,h*.15)}if(marker.show){const p=screen(marker.x,marker.y,cam,zoom),r=20+Math.sin(performance.now()/180)*3;x.beginPath();x.arc(p.x,p.y,r,0,6.28);x.fillStyle='#ffd839';x.fill();x.beginPath();x.arc(p.x,p.y,r+7,0,6.28);x.strokeStyle='rgba(255,216,57,.38)';x.lineWidth=5;x.stroke()}for(const n of npcs){if(!n.alive)continue;const p=screen(n.x,n.y,cam,zoom);x.fillStyle='#d9a681';x.beginPath();x.arc(p.x,p.y,5*zoom,0,6.28);x.fill();x.fillStyle='#3d5368';x.fillRect(p.x-4*zoom,p.y+4*zoom,8*zoom,13*zoom)}for(const q of cars)rectRot(q,cam,zoom,q.col);for(const p of police){rectRot(p,cam,zoom,'#15171b');const s=screen(p.x,p.y,cam,zoom);x.fillStyle=(Math.floor(performance.now()/160)%2)?'#ff3344':'#3388ff';x.fillRect(s.x-8,s.y-3,16,6)}for(const b of bullets){const p=screen(b.x,b.y,cam,zoom);x.fillStyle='#ffd45e';x.beginPath();x.arc(p.x,p.y,3,0,6.28);x.fill()}if(!inCar){const p=screen(player.x,player.y,cam,zoom);x.save();x.translate(p.x,p.y);x.rotate(player.a);x.fillStyle='#1d232c';x.beginPath();x.arc(0,0,10,0,6.28);x.fill();x.fillStyle='#d8a47f';x.beginPath();x.arc(8,0,4,0,6.28);x.fill();x.restore()}x.fillStyle='rgba(7,10,14,.65)';x.fillRect(W-106,H-144,88,88);x.strokeStyle='rgba(255,255,255,.18)';x.strokeRect(W-106,H-144,88,88);x.fillStyle='#ffd839';const mx=W-62+(marker.x-me.x)/14,my=H-100+(marker.y-me.y)/14;x.beginPath();x.arc(Math.max(W-102,Math.min(W-22,mx)),Math.max(H-140,Math.min(H-60,my)),3,0,6.28);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(W-62,H-100,3,0,6.28);x.fill()}let last=performance.now();function loop(now){if(!running)return;const dt=Math.min(.033,(now-last)/1000);last=now;upd(dt,now);draw();requestAnimationFrame(loop)}document.getElementById('start').onclick=()=>{document.getElementById('splash').style.display='none';running=true;last=performance.now();requestAnimationFrame(loop)};draw()})();</script></body></html>
