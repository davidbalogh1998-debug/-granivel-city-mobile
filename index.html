<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#0a0d12" />
<title>Granivel City Mobile</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0a0d12;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;touch-action:none;color:#fff}canvas{display:block;width:100%;height:100%}.hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:max(12px,env(safe-area-inset-top));left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.card{background:rgba(8,10,15,.68);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.25)}#mission{max-width:min(70vw,420px);font-size:13px;line-height:1.25}#stats{text-align:right;font-weight:800}.stars{letter-spacing:2px;color:#ffd84d}.controls{position:absolute;inset:0;pointer-events:none}.joy{position:absolute;left:22px;bottom:max(24px,env(safe-area-inset-bottom));width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);pointer-events:auto}.knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.4)}.buttons{position:absolute;right:18px;bottom:max(22px,env(safe-area-inset-bottom));display:grid;grid-template-columns:70px 70px;gap:10px;pointer-events:auto}.btn{height:62px;border:0;border-radius:18px;background:rgba(255,255,255,.15);color:#fff;font-weight:900;font-size:13px;border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(8px)}.btn:active{transform:scale(.96);background:rgba(255,255,255,.28)}#hint{position:absolute;bottom:165px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.65);padding:8px 12px;border-radius:99px;font-size:12px;white-space:nowrap}.cross{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);opacity:.55}.cross:before,.cross:after{content:"";position:absolute;background:#fff}.cross:before{left:8px;top:0;width:2px;height:18px}.cross:after{top:8px;left:0;height:2px;width:18px}.splash{position:fixed;inset:0;background:linear-gradient(160deg,#111827,#05070a);display:flex;align-items:center;justify-content:center;z-index:5}.splashbox{text-align:center;padding:28px}.splash h1{margin:0 0 8px;font-size:34px}.splash p{opacity:.75;max-width:430px}.start{margin-top:14px;padding:14px 24px;border:0;border-radius:14px;font-size:16px;font-weight:900;background:#fff;color:#0a0d12}.small{font-size:11px;opacity:.55;margin-top:10px}
</style>
</head>
<body>
<div class="splash" id="splash"><div class="splashbox"><h1>GRANIVEL CITY</h1><p>Mobilos open-world prototípus. Mozogj a joystickkal, szerezz autót, és rázd le a rendőröket.</p><button class="start" id="start">JÁTÉK INDÍTÁSA</button><div class="small">iPhone: Safari → Megosztás → Főképernyőhöz adás</div></div></div>
<canvas id="game"></canvas>
<div class="hud"><div class="top"><div class="card" id="mission">Küldetés: menj a sárga jelzéshez.</div><div class="card" id="stats">$ <span id="money">500</span><br><span class="stars" id="stars">☆☆☆☆☆</span></div></div><div class="cross"></div><div id="hint">Joystick: mozgás • AKCIÓ: autó</div></div>
<div class="controls"><div class="joy" id="joy"><div class="knob" id="knob"></div></div><div class="buttons"><button class="btn" id="act">AKCIÓ</button><button class="btn" id="shoot">LÖVÉS</button><button class="btn" id="brake">FÉK</button><button class="btn" id="sprint">SPRINT</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.min.js"></script>
<script>
const canvas=document.getElementById('game'), scene=new THREE.Scene();scene.background=new THREE.Color(0x94b6cf);scene.fog=new THREE.Fog(0x94b6cf,70,240);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500), renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;
scene.add(new THREE.HemisphereLight(0xddeeff,0x3a4b32,2.0));const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(50,90,30);sun.castShadow=true;scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(420,420),new THREE.MeshStandardMaterial({color:0x66735b,roughness:1}));ground.rotation.x=-Math.PI/2;scene.add(ground);
const roadMat=new THREE.MeshStandardMaterial({color:0x2b2d31,roughness:.95}), buildingMat=[0x8a7868,0x75879a,0xa0957c,0x776b7c,0x8c8c86].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:.85}));
function box(x,z,w,d,h,mat){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,h/2,z);m.castShadow=m.receiveShadow=true;scene.add(m);return m}
for(let i=-3;i<=3;i++){box(i*40,0,16,420,.12,roadMat);box(0,i*40,420,16,.13,roadMat)}
for(let gx=-4;gx<=4;gx++)for(let gz=-4;gz<=4;gz++){if(gx===0||gz===0)continue;const cx=gx*40,cz=gz*40;for(let k=0;k<3;k++){const x=cx+(k-1)*8+(Math.random()-0.5)*3,z=cz+(Math.random()-0.5)*17,h=10+Math.random()*28;box(x,z,6+Math.random()*4,7+Math.random()*6,h,buildingMat[(Math.random()*buildingMat.length)|0])}}
const player=new THREE.Group();const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.55,1.0,6,10),new THREE.MeshStandardMaterial({color:0x20252c}));torso.position.y=1.25;player.add(torso);const head=new THREE.Mesh(new THREE.SphereGeometry(.38,12,10),new THREE.MeshStandardMaterial({color:0xd6a37e}));head.position.y=2.25;player.add(head);player.position.set(0,0,18);scene.add(player);
function car(x,z,color=0xc0392b,police=false){const g=new THREE.Group();const body=new THREE.Mesh(new THREE.BoxGeometry(3.5,1.1,6),new THREE.MeshStandardMaterial({color}));body.position.y=.75;g.add(body);const roof=new THREE.Mesh(new THREE.BoxGeometry(2.6,.8,2.8),new THREE.MeshStandardMaterial({color:police?0xffffff:color}));roof.position.set(0,1.6,-.2);g.add(roof);for(const sx of[-1.55,1.55])for(const sz of[-2,2]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.48,.48,.38,12),new THREE.MeshStandardMaterial({color:0x111111}));w.rotation.z=Math.PI/2;w.position.set(sx,.45,sz);g.add(w)}if(police){const l=new THREE.Mesh(new THREE.BoxGeometry(1.5,.18,.35),new THREE.MeshStandardMaterial({color:0x2266ff,emissive:0x112244}));l.position.set(0,2.15,-.2);g.add(l)}g.position.set(x,0,z);g.userData={speed:0,police};scene.add(g);return g}
const cars=[car(10,7,0xd35400),car(-9,-6,0x2471a3),car(42,9,0x1abc9c),car(-42,-10,0x8e44ad),car(8,45,0xf1c40f)];const policeCars=[];
for(let i=0;i<14;i++){const n=torso.clone();n.material=new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(Math.random(),.25,.45)});n.position.set((Math.random()-.5)*130,1.25,(Math.random()-.5)*130);n.scale.set(.8,.9,.8);scene.add(n);n.userData={dir:new THREE.Vector3(Math.random()-.5,0,Math.random()-.5).normalize()};n.isNPC=true}
const marker=new THREE.Mesh(new THREE.CylinderGeometry(2.3,2.3,.25,24),new THREE.MeshStandardMaterial({color:0xffdc3d,emissive:0x5c4a00}));marker.position.set(25,.15,25);scene.add(marker);
let joy={x:0,y:0},inCar=null,wanted=0,money=500,mission=0,shootCooldown=0,lastCrime=0;
function setWanted(v){wanted=Math.max(0,Math.min(5,v));document.getElementById('stars').textContent='★'.repeat(wanted)+'☆'.repeat(5-wanted);lastCrime=performance.now();}
function nearestCar(){let best=null,d=9;for(const c of cars){const dd=(inCar?inCar:player).position.distanceTo(c.position);if(dd<d&&c!==inCar){d=dd;best=c}}return best}
function action(){if(inCar){player.position.copy(inCar.position).add(new THREE.Vector3(2.5,0,0));player.visible=true;inCar.userData.speed=0;inCar=null;return}const c=nearestCar();if(c){inCar=c;player.visible=false;if(mission===1){mission=2;marker.position.set(-28,.15,-30);document.getElementById('mission').textContent='Küldetés: vidd az autót a sárga ponthoz.'}}}
function shoot(){if(shootCooldown>0)return;shootCooldown=.3;setWanted(Math.max(1,wanted));const src=(inCar||player).position.clone().add(new THREE.Vector3(0,1.4,0));const dir=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);const ray=new THREE.Raycaster(src,dir,0,35);const hits=ray.intersectObjects(scene.children,false);if(hits.length){const h=hits[0].object;if(h.isNPC){scene.remove(h);money+=25;document.getElementById('money').textContent=money;setWanted(Math.max(2,wanted))}}}
document.getElementById('act').addEventListener('pointerdown',action);document.getElementById('shoot').addEventListener('pointerdown',shoot);
const joyEl=document.getElementById('joy'),knob=document.getElementById('knob');let joyId=null;function joyMove(e){const r=joyEl.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),m=Math.min(45,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);joy.x=Math.cos(a)*m/45;joy.y=Math.sin(a)*m/45;knob.style.transform=`translate(${joy.x*35}px,${joy.y*35}px)`}joyEl.addEventListener('pointerdown',e=>{joyId=e.pointerId;joyEl.setPointerCapture(joyId);joyMove(e)});joyEl.addEventListener('pointermove',e=>{if(e.pointerId===joyId)joyMove(e)});joyEl.addEventListener('pointerup',e=>{if(e.pointerId===joyId){joyId=null;joy.x=joy.y=0;knob.style.transform=''}});
let brake=false,sprint=false;document.getElementById('brake').onpointerdown=()=>brake=true;document.getElementById('brake').onpointerup=()=>brake=false;document.getElementById('sprint').onpointerdown=()=>sprint=true;document.getElementById('sprint').onpointerup=()=>sprint=false;
function spawnPolice(){if(policeCars.length>=wanted)return;const target=(inCar||player).position;const a=Math.random()*Math.PI*2,r=35;const p=car(target.x+Math.cos(a)*r,target.z+Math.sin(a)*r,0x111111,true);policeCars.push(p)}
function updateMission(){const pos=(inCar||player).position;if(mission===0&&pos.distanceTo(marker.position)<3.5){mission=1;marker.position.set(10,.15,7);document.getElementById('mission').textContent='Küldetés: szerezz egy autót az AKCIÓ gombbal.'}else if(mission===2&&inCar&&pos.distanceTo(marker.position)<5){mission=3;setWanted(2);marker.visible=false;document.getElementById('mission').textContent='Küldetés: rázd le a rendőröket!'}else if(mission===3&&wanted===0){mission=4;money+=1000;document.getElementById('money').textContent=money;document.getElementById('mission').textContent='Küldetés teljesítve! +$1000 • Szabad játék.'}}
let t=performance.now();function animate(now){requestAnimationFrame(animate);let dt=Math.min(.033,(now-t)/1000);t=now;shootCooldown=Math.max(0,shootCooldown-dt);const target=inCar||player;if(inCar){const throttle=-joy.y,steer=-joy.x;inCar.userData.speed+=throttle*18*dt;inCar.userData.speed*=brake?.90:.985;inCar.userData.speed=Math.max(-7,Math.min(24,inCar.userData.speed));inCar.rotation.y+=steer*dt*(.9+Math.abs(inCar.userData.speed)*.035);const f=new THREE.Vector3(0,0,-1).applyQuaternion(inCar.quaternion);inCar.position.addScaledVector(f,inCar.userData.speed*dt)}else{const v=new THREE.Vector3(joy.x,0,joy.y);if(v.length()>.05){v.normalize();player.position.addScaledVector(v,(sprint?9:5)*dt);player.rotation.y=Math.atan2(v.x,v.z)}}for(const o of scene.children){if(o.isNPC&&o.userData.dir){o.position.addScaledVector(o.userData.dir,dt*.8);if(Math.random()<.005)o.userData.dir.set(Math.random()-.5,0,Math.random()-.5).normalize()}}
if(wanted>0){spawnPolice();for(const p of policeCars){const d=target.position.clone().sub(p.position);d.y=0;if(d.length()>1){d.normalize();p.position.addScaledVector(d,(5+wanted*1.3)*dt);p.rotation.y=Math.atan2(-d.x,-d.z)}if(p.position.distanceTo(target.position)<4&&now-lastCrime>2500){money=Math.max(0,money-5);document.getElementById('money').textContent=money}}if(now-lastCrime>11000){setWanted(wanted-1);lastCrime=now}}for(let i=policeCars.length-1;i>=0;i--)if(wanted===0){scene.remove(policeCars[i]);policeCars.splice(i,1)}
updateMission();marker.rotation.y+=dt;const cp=target.position.clone();const back=new THREE.Vector3(0,0,inCar?11:7).applyQuaternion(target.quaternion);const desired=cp.clone().add(back).add(new THREE.Vector3(0,inCar?6:4.2,0));camera.position.lerp(desired,1-Math.pow(.001,dt));camera.lookAt(cp.clone().add(new THREE.Vector3(0,1.2,0)));renderer.render(scene,camera)}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
document.getElementById('start').onclick=()=>{document.getElementById('splash').style.display='none';requestAnimationFrame(animate)};
</script>
</body>
</html>
